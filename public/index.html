<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet d'exploration fonctionnelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: clinique, calme, moderne — l'outil quotidien d'un service hospitalier d'exploration fonctionnelle.
   IDEA: un poste de travail médical : barre latérale, tableau de bord, agenda, registre ; le tracé EEG comme signature.
   PICTURE: l'agenda du jour et l'activité des six derniers mois, en cartes nettes.
   COLOUR and TYPE: fond gris-bleu clair, cartes blanches, sarcelle médicale ; un code couleur par acte (EEG, sommeil, EFR) ; Plus Jakarta Sans.
   LAYOUT: barre latérale + contenu sur ordinateur, barre d'onglets en bas sur téléphone. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f5f8,#0a1317);--surface:light-dark(#ffffff,#101c21);--panel:light-dark(#f4f7f9,#16252b);--ink:light-dark(#0f1e25,#e5eef1);--mute:light-dark(#5d6d76,#93a7af);
--line:light-dark(#e2e8ed,#22343b);--brand:light-dark(#0b6e77,#4cc4cf);--brand2:light-dark(#e4f3f4,#0d2e33);--brandInk:light-dark(#ffffff,#03191c);--mark:light-dark(#fff4bf,#463f0e);
--ok:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--bad:light-dark(#dc2626,#f87171);
--a1:light-dark(#0d9488,#2dd4bf);--a2:light-dark(#6366f1,#a5b4fc);--a3:light-dark(#0284c7,#7dd3fc);--a0:light-dark(#64748b,#94a3b8);
--sh:0 1px 2px rgb(15 30 37/.05),0 2px 6px rgb(15 30 37/.05);--sh2:0 18px 48px rgb(15 30 37/.18);--r:16px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:inherit;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(24px,3vw,30px);font-weight:800}h3{font-size:17px;font-weight:700}
.ic{flex:none;display:block}
/* ---- coque ---- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 6px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,var(--a2)));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 35%,transparent)}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--mute);font-size:12.5px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;min-height:44px}
#nav a:hover{background:var(--panel);color:var(--ink)}
#nav a.on{background:var(--brand2);color:var(--brand)}
#nav .short{display:none}
.sidecard{margin-top:auto;background:var(--panel);border-radius:14px;padding:14px;font-size:13px;color:var(--mute)}
.sidecard b{color:var(--ink);display:block;margin-bottom:2px}
.content{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb-brand{display:none;align-items:center;gap:10px;font-weight:800}
.tb-brand .logo{width:34px;height:34px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
main{padding:clamp(18px,3vw,32px);max-width:1380px;width:100%;margin:0 auto;flex:1}
/* ---- éléments ---- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.pagehead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.pagehead .sub{margin:6px 0 0;color:var(--mute)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,2vw,22px)}
.panel+.panel{margin-top:16px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}.ph h3{flex:1}.ph .note{margin:0}
.btn{font:600 14.5px/1 "Plus Jakarta Sans",system-ui,sans-serif;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .05s}
a.btn{text-decoration:none}.btn:hover{background:var(--panel)}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--brand);color:var(--brandInk);border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 28%,transparent)}
.btn.p:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn.s{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--panel)}
.btn.icon{width:42px;padding:0}
.btn.d{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,#nav a:focus-visible,.card:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
input,select,textarea{font:15.5px "Plus Jakarta Sans",system-ui,sans-serif;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand2);outline:none}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--mute)}
label>input,label>select,label>textarea{margin-top:6px;color:var(--ink);font-weight:500}
fieldset .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.g3 .span2{grid-column:span 2}.g3 .full{grid-column:1/-1}.g3 .pecF{display:contents}
@media(max-width:640px){fieldset .g3{grid-template-columns:1fr}.g3 .span2{grid-column:auto}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.note{font-size:13.5px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--brand2);color:var(--brand);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}.chip.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chip.info{background:color-mix(in srgb,var(--a2) 14%,transparent);color:var(--a2)}
.q{display:grid;grid-template-columns:52px auto minmax(0,1fr);gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px}
.q .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:800;background:var(--panel)}
.q.urgence{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--surface))}.q.urgence .n{background:var(--bad);color:#fff}
.q.prio{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--surface))}.q.prio .n{background:var(--warn);color:#fff}
.q.encours{border-color:color-mix(in srgb,var(--a2) 50%,var(--line))}.q.encours .n{background:var(--a2);color:#fff}
.q .meta{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.q .act{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.btn.on-bad{background:var(--bad);color:#fff;border-color:transparent}.btn.on-warn{background:var(--warn);color:#fff;border-color:transparent}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-top:16px;align-items:start}.qgrid .panel+.panel{margin:0}
.dlist .row2{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}.dlist .row2:last-child{border:0}
.dlist .row2 b.h{font-size:16px}
@media(max-width:1000px){.qgrid{grid-template-columns:1fr}}
@media(max-width:600px){.q{grid-template-columns:44px minmax(0,1fr);gap:10px}.q .av{display:none}.dlist .row2{grid-template-columns:52px minmax(0,1fr)}.dlist .row2 .act{grid-column:1/-1}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;--c:var(--a0);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.a1{--c:var(--a1)}.a2{--c:var(--a2)}.a3{--c:var(--a3)}.a0{--c:var(--a0)}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:800;flex:none;color:#fff}
.av.v0{background:#0d9488}.av.v1{background:#6366f1}.av.v2{background:#0284c7}.av.v3{background:#db2777}.av.v4{background:#d97706}.av.v5{background:#7c3aed}
.pat{display:flex;align-items:center;gap:10px}.pat small{display:block;color:var(--mute);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.empty .ic{margin:0 auto 8px;opacity:.6}
/* ---- tableau de bord ---- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.kpi .kic{grid-row:span 2;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 13%,transparent)}
.kpi b{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute);font-weight:600}
.kpi .delta{grid-column:1/-1;font-size:12.5px;color:var(--mute);margin-top:6px;font-weight:600}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{grid-template-columns:1fr;gap:6px}.kpi .kic{grid-row:auto;width:36px;height:36px}.kpi .delta{margin-top:0}}
.dash{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.dash .col{display:grid;gap:16px}.dash .panel+.panel{margin:0}
.slot{display:grid;grid-template-columns:64px auto minmax(0,1fr) auto;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:center}
.slot:last-child{border-bottom:0}
.slot .h{font-size:18px;font-weight:800;line-height:1.1;white-space:nowrap}.slot .h small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.slot .who{font-weight:700}.slot .meta{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.slot .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bars{display:flex;gap:10px;height:190px;align-items:stretch}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar .colb{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.stackbar{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden;min-height:3px;background:var(--panel)}
.stackbar i{display:block;background:var(--c)}
.bar b{font-size:13px}.bar span{font-size:12px;color:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mute)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.mini{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.mini:last-child{border:0}
.mini .d{width:46px;text-align:center;border-radius:10px;background:var(--panel);padding:5px 0;line-height:1.1}.mini .d b{display:block;font-size:17px}.mini .d small{font-size:11px;color:var(--mute);text-transform:lowercase}
.mini .i{flex:1}.mini .i small{display:block;color:var(--mute);font-size:12.5px}
/* ---- tableaux ---- */
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
th{background:var(--panel);color:var(--mute);text-align:left;padding:11px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{background:var(--mark);font-weight:800}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:color-mix(in srgb,var(--brand2) 55%,transparent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rep h3{margin:24px 0 10px}
.rep .head{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}.rep .head h2{font-size:clamp(20px,2.4vw,24px)}
/* ---- archives ---- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.card .th{aspect-ratio:4/3;background:var(--panel);display:grid;place-items:center;color:var(--mute)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card div.c{padding:12px 14px;font-size:13.5px;display:grid;gap:6px}
.pj{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pj .it{position:relative;width:100px}
.pj .it .th{width:100px;height:100px;border-radius:12px;background:var(--panel);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--mute);border:1px solid var(--line)}
.pj img{width:100%;height:100%;object-fit:cover}
.pj .it button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer}
.pj .it small{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.drop-zone{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px;border:1.5px dashed color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--brand2) 45%,transparent)}
/* ---- fenêtres ---- */
dialog{border:0;border-radius:20px;padding:0;width:min(860px,96vw);max-height:92vh;background:var(--surface);color:var(--ink);box-shadow:var(--sh2)}
dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
dialog::backdrop{background:rgb(8 20 26/.5);backdrop-filter:blur(3px)}
dialog form,dialog .in{padding:0 24px 8px}
.dh{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;gap:12px;align-items:center;padding:20px 24px 16px;margin:0 -24px 16px;border-bottom:1px solid var(--line)}
.dh .ttl{flex:1}.dh small{color:var(--brand);font-weight:700;font-size:12.5px}.dh h2{font-size:22px}
.dh .x{width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:12px;padding:0}
legend .ic{color:var(--brand)}
dialog .foot{position:sticky;bottom:0;background:var(--surface);padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
dialog .in{padding:24px}
.viewer img{max-width:100%;display:block;margin:0 auto;border-radius:10px}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:var(--mute);font:600 14px "Plus Jakarta Sans",system-ui,sans-serif;padding:0 14px;min-height:36px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;box-shadow:var(--sh2)}
#toast.on{opacity:1}
/* ---- connexion ---- */
body.locked .side,body.locked .topbar{display:none}body.locked .app{grid-template-columns:1fr}
body.locked{background:radial-gradient(1200px 600px at 20% -10%,var(--brand2),transparent),var(--bg)}
.login{max-width:420px;margin:10vh auto;text-align:left}
.login .logo{width:56px;height:56px;border-radius:16px;margin-bottom:18px}
.pwbox{position:relative;margin-top:6px}.pwbox input{padding-right:52px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:40px;border:0;background:none;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
.eye:hover{color:var(--ink)}.eye[aria-pressed=false] .slash{display:none}
/* ---- agenda ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .when{font-size:17px;font-weight:800}
.calwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:14px}
.cal{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr));min-width:100%}.cal.v-week{min-width:760px}
.ch{position:sticky;top:0;z-index:3;background:var(--surface);border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 4px;font:600 13.5px "Plus Jakarta Sans",sans-serif;color:var(--mute);text-align:center;min-height:52px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.ch b{font-size:17px;color:var(--ink)}
.ch:first-child{border-left:0;cursor:default}.ch.today{color:var(--brand)}.ch.today b{background:var(--brand);color:var(--brandInk);border-radius:99px;padding:2px 8px}
.ch .chip{padding:2px 7px;font-size:11.5px}
.hrs{position:relative}.hrs span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--mute);font-weight:600}.hrs span:first-child{transform:none}
.dcol{position:relative;border-left:1px solid var(--line);cursor:copy;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 50%,transparent) 1px,transparent 1px);background-size:100% 64px,100% 32px}
.dcol:hover{background-color:color-mix(in srgb,var(--brand2) 35%,transparent)}
.dcol.today{background-color:color-mix(in srgb,var(--brand2) 45%,transparent)}.dcol.drop,.mcell.drop{outline:2px solid var(--brand);outline-offset:-2px;background-color:var(--brand2)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.ev{position:absolute;border-radius:9px;padding:4px 7px;font-size:12.5px;line-height:1.25;overflow:hidden;--c:var(--brand);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:3px solid var(--c);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:1;box-shadow:0 1px 2px rgb(0 0 0/.06)}
.ev:hover{box-shadow:0 4px 12px rgb(0 0 0/.12)}
.ev b.t{color:var(--c)}.ev span{color:var(--mute);font-size:11.5px}
.ev.honore::after{content:"✓";position:absolute;top:3px;right:6px;font-weight:800;color:var(--ok)}
.ev.attente::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn)}.ev.encours::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--a2)}
.ev.absent{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 10%,var(--surface)) 0 6px,var(--surface) 6px 12px);border-left-color:var(--bad)}
.ev.annule{opacity:.5;text-decoration:line-through}
.ev.dragging{z-index:6;box-shadow:var(--sh2);cursor:grabbing;opacity:.96}
.ev .rs{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mh{background:var(--panel);padding:10px;font-weight:700;font-size:12.5px;color:var(--mute);text-align:center}
.mcell{min-height:116px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;background:var(--surface)}.mcell:nth-child(7n+1){border-left:0}
.mcell:hover{background:color-mix(in srgb,var(--brand2) 35%,var(--surface))}
.mcell.out{background:var(--panel);color:var(--mute)}.dn{display:inline-grid;place-items:center;min-width:26px;height:26px;font-weight:700;font-size:13px;border-radius:99px}.mcell.today .dn{background:var(--brand);color:var(--brandInk)}
.ev.m{position:relative;margin-top:4px;white-space:nowrap;text-overflow:ellipsis;padding:3px 7px}
.hint{display:flex;gap:8px;align-items:center;margin:12px 2px 0}
.banner{background:var(--mark);color:#222;padding:8px 16px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);gap:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px)}
 .side .brand,.sidecard{display:none}

 main{padding-bottom:100px}

 #newTop .lbl,#nav .long{display:none}#nav .short{display:inline}

 .mcell{min-height:78px;padding:3px}.ev.m{font-size:11px;padding:2px 4px;border-left-width:3px}.ev.m b{display:none}
 .pagehead h2{font-size:24px}.kpi{padding:14px}.kpi b{font-size:24px}.pill{max-width:40vw}
 .stack thead{display:none}.stack tr{display:grid;padding-block:12px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-weight:600;font-size:12.5px}.stack td:empty{display:none}}

<body>
<div class="app">
<aside class="side">
  <div class="brand"><span class="logo" data-ic="wave"></span><div><b>Exploration fonctionnelle</b><small>EEG · Sommeil · EFR</small></div></div>
  <nav id="nav" aria-label="Navigation principale">

  <main id="main"></main>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
{
/* ---------- Référentiels (repris du carnet Excel) ---------- */
const ACTES=['EEG','EEG de sommeil','EFR'];
const PEC=['PAF','IB','LG','Pers','Grat','CAS.','Exo','P.S'];
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const STATUTS={prevu:['Prévu',''],attente:['En salle d’attente','warn'],encours:['En examen','info'],honore:['Honoré','ok'],absent:['Absent','bad'],annule:['Annulé','warn']};

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const frDate=s=>s?s.split('-').reverse().join('/'):'';
const longDate=s=>{const d=parse(s);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()].toLowerCase()+' '+d.getFullYear()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pct=(a,b)=>b?(a/b*100).toFixed(1).replace('.',',')+' %':'0,0 %';
const num=v=>{const n=Number(String(v??'').replace(/[^\d.-]/g,''));return isFinite(n)?n:0};
const fcfa=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' F';
const payTotal=e=>e.pec==='PAF'?num(e.montant):num(e.partEmp)+num(e.partPat);
const payLabel=e=>!e.pec?'':e.pec==='PAF'?(e.montant!==''&&e.montant!=null?fcfa(num(e.montant)):''):((e.partEmp||e.partPat)?'Empl. '+fcfa(num(e.partEmp))+' / Pat. '+fcfa(num(e.partPat)):'');
function pecFields(o){const pec=o.pec,f=(n,l)=>`<label>${l}<input name="${n}" type="number" min="0" step="1" inputmode="numeric" value="${esc(o[n]??'')}" placeholder="0"></label>`;
  return !pec?'':pec==='PAF'?f('montant','Montant payé (FCFA)'):f('partEmp','Part employeur (FCFA)')+f('partPat','Part patient (FCFA)')}
function idFields(o){return `<label>Sexe<select name="sexe">${opt([['H','Homme'],['F','Femme']],o.sexe,'—')}</select></label><label>Âge (ans)<input name="age" type="number" min="0" max="130" inputmode="numeric" value="${esc(o.age||'')}"></label><label>Date de naissance<input name="ddn" type="date" max="${today()}" value="${esc(o.ddn||'')}"><small class="note ddnE"${o.ddnEst?'':' hidden'}>Date estimée à partir de l’âge</small></label><input type="hidden" name="ddnEst" value="${o.ddnEst?'1':''}">`}
const ageFrom=ddn=>{const b=parse(ddn),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return Math.max(0,a)};
function bindAge(form){const A=form.querySelector('[name=age]'),D=form.querySelector('[name=ddn]'),E=form.querySelector('[name=ddnEst]'),N=form.querySelector('.ddnE');
  A.addEventListener('input',()=>{const a=parseInt(A.value,10);if(isNaN(a)||a<0||a>130){if(E.value){D.value='';}return}D.value=(new Date().getFullYear()-a)+'-01-01';E.value='1';N.hidden=false});
  D.addEventListener('input',()=>{if(!D.value)return;A.value=ageFrom(D.value);E.value='';N.hidden=true})}
function cleanPay(o){if(o.pec!=='PAF')delete o.montant;if(!o.pec||o.pec==='PAF'){delete o.partEmp;delete o.partPat}return o}
function bindPec(form,o){const sel=form.querySelector('select[name=pec]'),box=form.querySelector('.pecF');
  sel.addEventListener('change',()=>{for(const i of box.querySelectorAll('input'))o[i.name]=i.value;o.pec=sel.value;box.innerHTML=pecFields(o)})}
function finance(L){
  const rows=PEC.map(p=>{const l=L.filter(e=>e.pec===p);return p==='PAF'?[p,l.length,fcfa(l.reduce((t,e)=>t+num(e.montant),0)),'—','—',fcfa(l.reduce((t,e)=>t+payTotal(e),0))]
    :[p,l.length,'—',fcfa(l.reduce((t,e)=>t+num(e.partEmp),0)),fcfa(l.reduce((t,e)=>t+num(e.partPat),0)),fcfa(l.reduce((t,e)=>t+payTotal(e),0))]});
  const P=L.filter(e=>PEC.includes(e.pec));
  return{h:'Recettes par prise en charge',head:['Prise en charge','Actes','Montant PAF','Part employeur','Part patient','Total'],body:rows,
    foot:['TOTAL',P.length,fcfa(P.reduce((t,e)=>t+(e.pec==='PAF'?num(e.montant):0),0)),fcfa(P.reduce((t,e)=>t+(e.pec!=='PAF'?num(e.partEmp):0),0)),fcfa(P.reduce((t,e)=>t+(e.pec!=='PAF'?num(e.partPat):0),0)),fcfa(P.reduce((t,e)=>t+payTotal(e),0))]};
}
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
const opt=(list,val,empty)=>(empty!=null?`<option value="">${esc(empty)}</option>`:'')+list.map(v=>{const[k,l]=Array.isArray(v)?v:[v,v];return `<option value="${esc(k)}"${String(k)===String(val??'')?' selected':''}>${esc(l)}</option>`}).join('');

/* ---------- Icônes ---------- */
const P={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',archive:'<rect x="3" y="3.5" width="18" height="5" rx="1.5"/><path d="M5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8.5M10 12.5h4"/>',
chart:'<path d="M3 21h18"/><rect x="5" y="11" width="3.5" height="7" rx="1"/><rect x="10.25" y="5" width="3.5" height="13" rx="1"/><rect x="15.5" y="8.5" width="3.5" height="9.5" rx="1"/>',wave:'<path d="M2 12h3.5l2-5 3 10 3-14 3 13 2-4H22"/>',
moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',wind:'<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
cam:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',clip:'<path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',left:'<path d="m15 6-6 6 6 6"/>',right:'<path d="m9 6 6 6-6 6"/>',
money:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',steth:'<path d="M5 3v6a5 5 0 0 0 10 0V3M10 14v2a5 5 0 0 0 10 0v-3"/><circle cx="20" cy="11" r="2"/>',note:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',hand:'<path d="M7 11V6a2 2 0 0 1 4 0v5M11 10V4a2 2 0 0 1 4 0v6M15 10V6a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.5L3 14a2 2 0 0 1 3.4-2z"/>'};
P.up='<path d="m6 15 6-6 6 6"/>';P.down='<path d="m6 9 6 6 6-6"/>';
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,e.classList.contains('logo')?22:20));
const AC=a=>'a'+((ACTES.indexOf(a)+1)||0);
const AICON={EEG:'wave','EEG de sommeil':'moon',EFR:'wind'};
const initials=n=>(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const av=n=>{let h=0;for(const c of n||'')h=(h*31+c.charCodeAt(0))%6;return `<span class="av v${h}" aria-hidden="true">${esc(initials(n))}</span>`};
const tag=a=>a?`<span class="tag ${AC(a)}">${esc(a)}</span>`:'';
const stChip=r=>{const[st,cl]=STATUTS[r.statut||'prevu'];return `<span class="chip ${cl}">${st}</span>`};
const pageHead=(t,sub,act)=>`<div class="pagehead"><div><h2>${t}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="row">${act||''}</div></div>`;
const emptyBox=(t,i)=>`<div class="empty">${ic(i||'file',28)}${t}</div>`;
const provL=p=>p==='Ext'?'Externe':p==='Int'?'Interne':'';

/* ---------- Stockage : base de l'artefact, sinon navigateur ---------- */
const S={exams:[],rdvs:[],mode:'local',db:null,assets:null,dl:null};
const LS='carnet-ef-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'{}');S.exams=j.exams||[];S.rdvs=j.rdvs||[]}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({exams:S.exams,rdvs:S.rdvs}))}catch(e){toast('Stockage local plein')}}
const COL={exams:'examens',rdvs:'rendezvous'};
async function put(kind,obj){
  const list=S[kind],i=list.findIndex(x=>x.id===obj.id);
  if(i<0)list.push(obj);else list[i]=obj;
  if(S.mode==='db'){const{id,...body}=obj;try{await S.db.collection(COL[kind]).doc(id).set(JSON.parse(JSON.stringify(body)))}catch(e){toast(e.code==='quota_exceeded'?'Base pleine : supprimez des éléments':'Échec de l’enregistrement');throw e}}
  else if(S.mode==='api'){const r=await api('PUT','/api/items/'+COL[kind]+'/'+encodeURIComponent(obj.id),JSON.stringify(obj));if(!r.ok){toast('Échec de l’enregistrement');throw new Error('save')}}
  else saveLocal();
  render();
}
async function del(kind,id){
  S[kind]=S[kind].filter(x=>x.id!==id);
  if(S.mode==='db'){try{await S.db.collection(COL[kind]).doc(id).delete()}catch(e){toast('Échec de la suppression')}}else if(S.mode==='api'){const r=await api('DELETE','/api/items/'+COL[kind]+'/'+encodeURIComponent(id));if(!r.ok)toast('Échec de la suppression')}else saveLocal();
  render();
}
async function initStore(){
  const c=window.claude;
  if(!c||!c.use){await initApi();return}
  const db=await Promise.race([c.use('db').catch(()=>null),new Promise(r=>setTimeout(()=>r(null),10000))]);
  if(!db){setLocal();return}
  S.db=db;S.mode='db';
  c.use('assets').then(a=>S.assets=a).catch(()=>{});
  c.use('downloads').then(d=>S.dl=d).catch(()=>{});
  let got=0;const timer=setTimeout(()=>{if(got<2)$('#sync').textContent='Données injoignables pour le moment'},10000);
  for(const kind of ['exams','rdvs']){
    let first=true;
    db.collection(COL[kind]).onSnapshot(s=>{S[kind]=s.docs.map(d=>({...d.data(),id:d.id}));if(first&&!s.metadata.fromCache){first=false;got++}if(got>=2){clearTimeout(timer);$('#sync').textContent='Enregistré en ligne'}render()},
      e=>{clearTimeout(timer);$('#sync').textContent='Accès aux données refusé ou interrompu'});
  }
}
/* Mode serveur (Cloudflare) : /api/* protégé par mot de passe */
async function api(method,url,body,headers){
  const r=await fetch(url,{method,body,headers:{'content-type':'application/json',...(headers||{})},credentials:'same-origin'});
  if(r.status===401&&!url.endsWith('/login')){S.needLogin=true;render()}
  return r;
}
async function initApi(){
  let r;try{r=await fetch('/api/me',{credentials:'same-origin'})}catch(e){setLocal();return}
  if(!(r.headers.get('content-type')||'').includes('json')){setLocal();return}
  S.mode='api';$('#out').hidden=false;
  if(r.status===401){S.needLogin=true;$('#sync').textContent='Connexion requise';render();return}
  if(!r.ok){$('#sync').textContent='Serveur indisponible ('+r.status+')';return}
  await pull();setInterval(()=>{if(!dlg.open&&!document.hidden)pull()},60000);
  addEventListener('focus',()=>{if(!dlg.open)pull()});
}
async function pull(){
  if(S.needLogin)return;
  try{const r=await api('GET','/api/items');if(!r.ok)return;const j=await r.json();S.exams=j.examens||[];S.rdvs=j.rendezvous||[];
    $('#sync').textContent='Enregistré sur le serveur · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});render()}
  catch(e){$('#sync').textContent='Hors ligne : données non à jour'}
}

/* ---------- Pièces jointes ---------- */
async function shrink(file){
  if(!file.type.startsWith('image/')||file.type==='image/svg+xml')return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.82));}catch(e){return file}
}
const toDataURL=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});
async function storeFile(file){
  const blob=await shrink(file);
  const type=blob.type||file.type;
  if(S.mode==='db'){
    if(!S.assets)throw new Error('Envoi de fichiers indisponible (droits d’édition requis)');
    const a=await S.assets.upload(blob);
    return{aid:a.id,url:'/_blob/'+a.id,name:file.name||'photo.jpg',type:a.contentType||type,size:a.sizeBytes};
  }
  if(S.mode==='api'){
    const r=await api('POST','/api/files',blob,{'content-type':type,'x-filename':encodeURIComponent(file.name||'photo.jpg')});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Envoi impossible');
    return{key:j.key,url:j.url,name:j.name,type:j.type,size:j.size};
  }
  return{url:await toDataURL(blob),name:file.name||'photo.jpg',type,size:blob.size};
}
const isImg=p=>/^image\//.test(p.type||'');
const safeUrl=u=>/^(\/_blob\/|\/api\/files\/[0-9a-f-]{36}$|data:image\/|data:application\/pdf|blob:)/.test(u||'')?u:'';

const PXH=64,PXM=PXH/60,JC=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const toMin=h=>{const[a,b]=(h||'08:00').split(':').map(Number);return a*60+(b||0)};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dur=r=>+r.duree||30;
const addDays=(s,n)=>{const x=parse(s);x.setDate(x.getDate()+n);return iso(x)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
function calRange(){const t=S.rdvs.filter(r=>r.heure);let a=7*60,b=19*60;for(const r of t){a=Math.min(a,Math.floor(toMin(r.heure)/60)*60);b=Math.max(b,Math.ceil((toMin(r.heure)+dur(r))/60)*60)}return[a,Math.min(b,24*60)]}
function lanes(R){ // répartit les rendez-vous qui se chevauchent côte à côte
  const L=R.map(r=>({r,s:toMin(r.heure),e:toMin(r.heure)+dur(r)})).sort((a,b)=>a.s-b.s||b.e-a.e);let grp=[],end=-1;const out=[];
  const flush=()=>{const cols=[];for(const x of grp){let c=cols.findIndex(e=>e<=x.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=x.e;x.c=c}for(const x of grp)x.n=cols.length;out.push(...grp);grp=[]};
  for(const x of L){if(x.s>=end&&grp.length)flush();grp.push(x);end=Math.max(end,x.e)}if(grp.length)flush();return out;
}
function evHTML(x,a){const r=x.r,top=(x.s-a)*PXM,h=Math.max(dur(r)*PXM-2,22);

let drag=null;
document.addEventListener('pointerdown',ev=>{const el=ev.target.closest('.ev');if(!el||ev.button>0||!$('#main').contains(el))return;
  const r=S.rdvs.find(x=>x.id===el.dataset.id);if(!r)return;const rc=el.getBoundingClientRect();
  drag={el,r,x0:ev.clientX,y0:ev.clientY,moved:false,resize:!!ev.target.closest('.rs'),off:ev.clientY-rc.top,top0:rc.top,left0:rc.left,col0:el.closest('.dcol')};
  try{el.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()});
document.addEventListener('pointermove',ev=>{if(!drag)return;const g=drag,dx=ev.clientX-g.x0,dy=ev.clientY-g.y0;
  if(!g.moved&&Math.hypot(dx,dy)<6)return;g.moved=true;g.el.classList.add('dragging');
  const hits=document.elementsFromPoint(ev.clientX,ev.clientY);
  document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  if(g.el.classList.contains('m')){const c=hits.find(x=>x.classList&&x.classList.contains('mcell'));g.target=c?{date:c.dataset.d}:null;if(c)c.classList.add('drop');g.el.style.transform=`translate(${dx}px,${dy}px)`;return}
  const a=+getComputedStyle(document.querySelector('.cal')).getPropertyValue('--a'),cr=g.col0.getBoundingClientRect();
  if(g.resize){const d=Math.max(15,Math.round((ev.clientY-g.top0)/PXM/15)*15);g.el.style.height=(d*PXM-2)+'px';g.target={date:g.r.date,heure:g.r.heure,duree:d};g.el.querySelector('.t').textContent=g.r.heure+'–'+toHM(toMin(g.r.heure)+d);return}
  const col=hits.find(x=>x.classList&&x.classList.contains('dcol'))||g.col0,rc=col.getBoundingClientRect();
  let m=Math.round(((ev.clientY-g.off)-rc.top)/PXM/15)*15+a;m=Math.max(0,Math.min(m,24*60-dur(g.r)));
  g.target={date:col.dataset.d,heure:toHM(m)};col.classList.add('drop');
  g.el.style.transform=`translate(${rc.left-cr.left}px,${(m-toMin(g.r.heure))*PXM}px)`;g.el.querySelector('.t').textContent=toHM(m);
});
const endDrag=async(ev,cancel)=>{if(!drag)return;const g=drag;drag=null;document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  if(!g.moved){if(!cancel)rdvForm(g.r.id);return}
  if(cancel||!g.target){render();return}
  const o={...g.r,...g.target};if(o.date===g.r.date&&o.heure===g.r.heure&&dur(o)===dur(g.r)){render();return}
  await put('rdvs',o);toast('Rendez-vous déplacé : '+frDate(o.date)+' à '+o.heure)};

  const base=S.exams.find(x=>x.id===id);
  const e=base?{...base,pieces:[...(base.pieces||[])]}:{id:uid(),date:today(),created:new Date().toISOString(),pieces:[],acte:'EEG'};
  if(fromRdv)Object.assign(e,{sexe:fromRdv.sexe,age:fromRdv.ddn&&!fromRdv.ddnEst?String(ageFrom(fromRdv.ddn)):fromRdv.age,ddn:fromRdv.ddn,ddnEst:fromRdv.ddnEst,nom:fromRdv.nom,acte:fromRdv.acte,prov:fromRdv.prov,pec:fromRdv.pec,montant:fromRdv.montant,partEmp:fromRdv.partEmp,partPat:fromRdv.partPat,date:fromRdv.date,rdv:fromRdv.id,service:fromRdv.motif||''});
  const pj=()=>e.pieces.map((p,i)=>{const u=safeUrl(p.url);return `<div class="it"><a class="th" href="#" data-view="${i}">${isImg(p)&&u?`<img src="${esc(u)}" alt="">`:'PDF'}</a><button type="button" data-rm="${i}" aria-label="Retirer">×</button><small>${esc(p.name)}</small></div>`}).join('');
  openDlg(`<form id="fE"><div class="dh"><div class="ttl"><small>${base?'Examen n° '+(numbered(),base._n):'Registre'}</small><h2>${base?esc(base.nom):'Nouvel examen'}</h2></div><button type="button" class="x" data-x aria-label="Fermer">${ic('x',18)}</button></div>
  <fieldset><legend>${ic('user',18)}Patient</legend><div class="g3">
  <label class="full">Prénom et nom *<input name="nom" required value="${esc(e.nom||'')}"></label>${idFields(e)}</div></fieldset>
  <fieldset><legend>${ic('wave',18)}Examen</legend><div class="grid">
  <label>Date de l’examen *<input name="date" type="date" required value="${esc(e.date)}"></label><label>Acte *<select name="acte" required>${opt(ACTES,e.acte)}</select></label>
  <label>Provenance<select name="prov">${opt([['Ext','Externe'],['Int','Interne']],e.prov,'—')}</select></label><label>Service demandeur<input name="service" value="${esc(e.service||'')}"></label></div></fieldset>
  <fieldset><legend>${ic('money',18)}Prise en charge</legend><div class="g3"><label>PAF / Autres<select name="pec">${opt(PEC,e.pec,'—')}</select></label>
  <div class="pecF">${pecFields(e)}</div></div></fieldset>
  <fieldset><legend>${ic('steth',18)}Clinique et conclusion</legend>
  <label>Diagnostic / indication<textarea name="diag">${esc(e.diag||'')}</textarea></label>
  <label style="margin-top:14px">Observations<textarea name="obs">${esc(e.obs||'')}</textarea></label>
  <label style="margin-top:14px">Compte rendu (conclusion saisie)<textarea name="cr">${esc(e.cr||'')}</textarea></label></fieldset>
  <fieldset><legend>${ic('archive',18)}Compte rendu archivé</legend>
  <div class="drop-zone"><label class="btn p">${ic('cam',18)}Prendre une photo<input type="file" accept="image/*" capture="environment" hidden id="pPh"></label><label class="btn">${ic('file',18)}Ajouter un document<input type="file" accept="image/*,application/pdf" multiple hidden id="pDoc"></label><span class="note" id="pSt">Photo ou PDF · réduits automatiquement</span></div>
  <div class="pj" id="pj">${pj()}</div></fieldset></form>
  <div class="foot"><button class="btn p" form="fE">${ic('check',18)}Enregistrer</button><button class="btn" type="button" id="xE">Fermer</button>${base?`<button class="btn" type="button" id="fiche">${ic('dl',18)}Fiche PDF</button>`:''}<span class="sp"></span>${base?'<button class="btn d" id="dE">Supprimer</button>':''}</div>`);
  const refresh=()=>{$('#pj').innerHTML=pj()};
  const add=async files=>{for(const f of files){$('#pSt').textContent='Envoi de '+f.name+'…';try{e.pieces.push(await storeFile(f));refresh()}catch(err){toast(err.message||'Envoi impossible')}}$('#pSt').textContent='Photo ou PDF · réduits automatiquement'};
  $('#pPh').onchange=ev=>add([...ev.target.files]);$('#pDoc').onchange=ev=>add([...ev.target.files]);
  $('#pj').onclick=ev=>{const rm=ev.target.closest('[data-rm]'),vw=ev.target.closest('[data-view]');
    if(rm){e.pieces.splice(+rm.dataset.rm,1);refresh()}
    if(vw){ev.preventDefault();viewPiece(e.pieces[+vw.dataset.view])}};
  $('#xE').onclick=()=>dlg.close();
  bindPec($('#fE'),{...e});bindAge($('#fE'));
  const collect=()=>{const o=cleanPay({...e,...Object.fromEntries(new FormData($('#fE')))});o.nom=(o.nom||'').trim();delete o._n;return o};
  $('#fE').onsubmit=async ev=>{ev.preventDefault();const o=collect();dlg.close();await put('exams',o);
    if(fromRdv){const r=S.rdvs.find(x=>x.id===fromRdv.id);if(r)await put('rdvs',{...r,statut:'honore',exam:o.id})}toast('Examen enregistré')};
  if(base){$('#fiche').onclick=()=>fichePDF(collect());$('#dE').onclick=()=>askConfirm('Supprimer cet examen et ses pièces ?',async()=>{for(const p of base.pieces||[]){if(p.aid&&S.assets)try{await S.assets.delete(p.aid)}catch(x){}if(p.key&&S.mode==='api')await api('DELETE','/api/files/'+p.key)}del('exams',id)})}
}
function viewPiece(p){
  const u=safeUrl(p.url);if(!u)return;
  const w=document.createElement('dialog');w.className='viewer';
  w.innerHTML=`<div class="in">${isImg(p)?`<img src="${esc(u)}" alt="${esc(p.name)}">`:`<p>${esc(p.name)}</p><p><a href="${esc(u)}" target="_blank" rel="noopener">Ouvrir le document</a></p>`}</div><div class="foot"><button class="btn" type="button">Fermer</button></div>`;
  document.body.append(w);w.querySelector('button').onclick=()=>{w.close();w.remove()};w.showModal();
}

/* ---------- Événements ---------- */
document.addEventListener('click',ev=>{
  if(ev.target.closest('.ev'))return;
  const t=ev.target.closest('[data-a]');if(!t||t.closest('#dlg form'))return;const a=t.dataset.a,id=t.dataset.id;
  if(a==='rdv')rdvForm(id);
  else if(a==='exam')examForm(id);
  else if(a==='arrive'){const r=S.rdvs.find(x=>x.id===id);put('rdvs',{...r,statut:'attente',arrivee:nowHM(),qpos:Date.now()}).then(()=>toast(r.nom+' est en salle d’attente (n° '+(queueOf(r.date).findIndex(x=>x.id===id)+1)+')'))}
  else if(a==='qup'||a==='qdown')qMove(id,a==='qup'?-1:1);
  else if(a==='qprio'){const r=S.rdvs.find(x=>x.id===id),k=t.dataset.k;put('rdvs',{...r,prio:r.prio===k?'':k}).then(()=>k!==r.prio&&toast(k==='urgence'?'Urgence : patient placé en tête de file':'Prioritaire : patient remonté dans la file'))}
  else if(a==='qcall'){const r=S.rdvs.find(x=>x.id===id);put('rdvs',{...r,statut:'encours',debut:nowHM()})}
  else if(a==='qback'){const r=S.rdvs.find(x=>x.id===id);put('rdvs',{...r,statut:'attente'})}
  else if(a==='qout'){const r=S.rdvs.find(x=>x.id===id);put('rdvs',{...r,statut:'prevu',arrivee:'',qpos:0,prio:''})}
  else if(a==='qfin')examForm(null,S.rdvs.find(r=>r.id===id));
  else if(a==='absent'){const r=S.rdvs.find(x=>x.id===id);put('rdvs',{...r,statut:'absent'})}
  else if(a==='wk'){const d=+t.dataset.d;if(!d)V.rdvDay=today();else if(V.cal==='month'){const x=parse(V.rdvDay);x.setDate(1);x.setMonth(x.getMonth()+d);V.rdvDay=iso(x)}else V.rdvDay=addDays(V.rdvDay,d*(V.cal==='week'?7:1));render()}
  else if(a==='cv'){V.cal=t.dataset.k;render()}
  else if(a==='gday'||a==='mday'){V.rdvDay=t.dataset.d;V.cal='day';render()}
  else if(a==='newat'){const rc=t.getBoundingClientRect(),cs=getComputedStyle(document.querySelector('.cal'));const m=Math.floor((ev.clientY-rc.top)/PXM/30)*30+(+cs.getPropertyValue('--a'));rdvForm(null,{date:t.dataset.d,heure:toHM(m)})}
  else if(a==='rk'){V.rep.kind=t.dataset.k;render()}
  else if(a==='pdf')repPDF(curRep());
  else if(a==='xlsx')repXLSX(curRep());
  else if(a==='copy'){navigator.clipboard.writeText(repText(curRep())).then(()=>toast('Rapport copié'),()=>toast('Copie refusée'))}
  else if(a==='regxlsx'){if(!window.XLSX)return toast('Module Excel non chargé');const L=regList().reverse();
    const ws=XLSX.utils.aoa_to_sheet([['N°','Date','Prénom et nom','Sexe','Âge','Date de naissance','Provenance','Service','PAF / Autres','Montant PAF','Part employeur','Part patient','Total payé','Acte','Diagnostic','Observations','Compte rendu','Pièces'],...L.map(e=>[e._n,frDate(e.date),e.nom,e.sexe||'',e.age||'',e.ddn?frDate(e.ddn)+(e.ddnEst?' (estimée)':''):'',e.prov||'',e.service||'',e.pec||'',e.pec==='PAF'?num(e.montant):'',e.pec&&e.pec!=='PAF'?num(e.partEmp):'',e.pec&&e.pec!=='PAF'?num(e.partPat):'',e.pec?payTotal(e):'',e.acte||'',e.diag||'',e.obs||'',e.cr||'',(e.pieces||[]).length])]);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registre');download('Registre_'+V.reg.y+(V.reg.m!==''?'-'+pad(+V.reg.m+1):'')+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]))}
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.closest('dialog'))return;
  const map={fQ:()=>V.reg.q=t.value,aQ:()=>V.arch.q=t.value};if(map[t.id]){map[t.id]();render()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.closest('dialog'))return;
  const map={fY:()=>V.reg.y=t.value,fM:()=>V.reg.m=t.value,fA:()=>V.reg.acte=t.value,aY:()=>V.arch.y=t.value,rdvDay:()=>t.value&&(V.rdvDay=t.value),
    rM:()=>V.rep.m=+t.value,rY:()=>V.rep.y=+t.value||V.rep.y,rA:()=>V.rep.a=t.value||V.rep.a,rB:()=>V.rep.b=t.value||V.rep.b};
  if(map[t.id]){map[t.id]();render()}});
addEventListener('hashchange',route);
setInterval(()=>{if(!dlg.open&&!drag&&!S.needLogin&&['accueil','rendez-vous'].includes(V.view)&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))render()},60000);
$('#out').onclick=async()=>{await api('POST','/api/logout');S.exams=[];S.rdvs=[];S.needLogin=true;render()};
route();
initStore();
}
</script>
</body>
